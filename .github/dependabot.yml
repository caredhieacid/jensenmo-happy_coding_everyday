version: 2

multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: monthly
    labels:
      - dependencies
      - automation

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly-dependencies
  - package-ecosystem: pip
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly-dependencies
